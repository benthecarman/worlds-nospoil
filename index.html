<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Worlds — no spoilers</title>
<style>
body{margin:0;background:#0b0d12;color:#ddd;font:15px system-ui,sans-serif}
header{padding:12px 16px;background:#141824;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1}
#list{padding:10px 16px;max-width:900px;margin:auto}
.day{margin:16px 0 6px;color:#8aa;font-weight:600}
.m{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:#161b26;margin:6px 0}
.m .t{flex:1}.m small{color:#889}.w{opacity:.55}
button{background:#2a3350;color:#eee;border:0;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
button:disabled{opacity:.4}
#view{display:none;max-width:1100px;margin:auto;padding:10px}
#wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#tw iframe{width:100%;height:100%;border:0}#yt{position:absolute;inset:0;width:100%;height:100%}
#shield{position:absolute;inset:0;z-index:2}            /* blocks clicks/hover title on the iframe */
#cover{position:absolute;inset:0;z-index:3;background:#000;display:flex;align-items:center;justify-content:center;font-size:20px;color:#aaa;text-align:center;padding:20px}
#ctl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;align-items:center}
#time{font-variant-numeric:tabular-nums;min-width:80px;font-size:18px}
#view:fullscreen,#view.pfs{position:fixed;inset:0;max-width:none;margin:0;padding:6px;background:#000;z-index:99;display:flex!important;flex-direction:column;box-sizing:border-box}
#view:-webkit-full-screen{width:100%;height:100%;max-width:none;margin:0;padding:6px;background:#000;display:flex!important;flex-direction:column;box-sizing:border-box}
#view:fullscreen #wrap,#view.pfs #wrap{flex:none;width:min(100%,calc((100vh - 12px)*16/9));aspect-ratio:16/9;margin:auto}
#view:fullscreen #back,#view.pfs #back{display:none}
#view:fullscreen #info,#view.pfs #info,#view:fullscreen #ctl,#view.pfs #ctl,#view:fullscreen #ctl2,#view.pfs #ctl2{position:absolute;left:10px;right:10px;z-index:5;background:rgba(0,0,0,.75);padding:6px;border-radius:6px;transition:opacity .3s}
#view:fullscreen #info,#view.pfs #info{top:6px}
#view:fullscreen #ctl,#view.pfs #ctl{bottom:46px}#view:fullscreen #ctl2,#view.pfs #ctl2{bottom:6px}
#view.hidectl:fullscreen #info,#view.hidectl.pfs #info,#view.hidectl:fullscreen #ctl,#view.hidectl.pfs #ctl,#view.hidectl:fullscreen #ctl2,#view.hidectl.pfs #ctl2{opacity:0;pointer-events:none}
#view.hidectl:fullscreen,#view.hidectl.pfs,#view.hidectl:fullscreen *,#view.hidectl.pfs *{cursor:none}
#info{color:#99a;margin:6px 0}
</style></head><body>
<header><h1>Worlds 2026 — spoiler-free</h1><label><input type="checkbox" id="showAll"> show all team names</label></header>
<div id="list"></div>
<div id="view">
 <button id="back">← Matches</button>
 <div id="info"></div>
 <div id="wrap"><div id="yt"></div><div id="tw" style="position:absolute;left:0;right:0;top:-120px;height:calc(100% + 240px);display:none"></div><video id="nv" playsinline style="position:absolute;inset:0;width:100%;height:100%;display:none;background:#000"></video><div id="shield"></div><div id="cover">Tap ▶ to start</div></div>
 <div id="ctl">
  <button id="pp">▶</button><span id="time">0:00</span>
  <button data-s="-60">−1m</button><button data-s="-10">−10s</button><button data-s="10">+10s</button><button data-s="60">+1m</button><button data-s="300">+5m</button>
  <input id="vol" type="range" min="0" max="100" value="80" style="width:90px">
  <select id="spd"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
  <button id="fs" title="Fullscreen (f / double-click)">⛶</button>
  <input id="jump" placeholder="h:mm:ss" size="7"><button id="go">Go</button>
 </div>
 <div id="ctl2"><button id="next">Next part / game ›</button> <button id="alt" style="display:none">Other source</button> <span id="msg"></span></div>
</div>
<script>
const LS=localStorage, $=s=>document.querySelector(s);
let D, P, cur=null, srcList=[], srcIdx=0, ready=false, tick;
const fmt=s=>{s=Math.floor(s);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const watched=id=>LS['w_'+id]==='1';
function visibleTeams(i){ // reveal teams only when every earlier match is watched (or toggle on)
  if($('#showAll').checked) return true;
  return D.matches.slice(0,i).every(m=>watched(m.id)||m.teams.includes('TBD')) }
function render(){
  const L=$('#list'); L.innerHTML=''; let day='';
  D.matches.forEach((m,i)=>{
    const d=new Date(m.start), ds=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    if(ds!==day){day=ds;L.insertAdjacentHTML('beforeend',`<div class="day">${ds}</div>`)}
    const tbd=m.teams.includes('TBD'), show=!tbd&&visibleTeams(i);
    const has=(m.twitch||[]).length||m.caedrel.length||m.official.length;
    const el=document.createElement('div'); el.className='m'+(watched(m.id)?' w':'');
    el.innerHTML=`<div class="t">${show?m.teams.join(' vs '):(tbd?'Teams TBD':'<i>teams hidden</i> <button class="rv">reveal</button>')}<br><small>${m.stage} · Bo${m.bestOf} · ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${watched(m.id)?' · watched':''}</small></div>`;
    const b=document.createElement('button'); b.textContent=has?'Watch':'No VOD yet'; b.disabled=!has; b.onclick=()=>open(m,i);
    el.append(b); const wb=document.createElement('button'); wb.textContent=watched(m.id)?'↺':'✓';
    wb.title='mark watched'; wb.onclick=()=>{LS['w_'+m.id]=watched(m.id)?'0':'1';render()}; el.append(wb);
    const rv=el.querySelector('.rv'); if(rv) rv.onclick=()=>{rv.parentNode.textContent=m.teams.join(' vs ')};
    L.append(el)})}
function open(m,i){
  cur=m; srcList=srcs(m)[0];
  srcIdx=+(LS['src_'+m.id]||0); if(srcIdx>=srcList.length) srcIdx=0;
  $('#list').style.display='none'; $('#view').style.display='block'; $('#msg').textContent='';
  $('#alt').style.display=srcs(m).length>1?'':'none';
  load(); if(location.hash!=='#'+m.id)history.pushState({}, '', '#'+m.id)}
function srcs(m){const o=[];
  if((m.twitch||[]).length)o.push(m.twitch.map(x=>['Caedrel (full Twitch stream)',x.v,'tw',x.t]));
  if(m.caedrel.length)o.push(m.caedrel.map(v=>['Caedrel co-stream (YouTube)',v,'yt',0]));
  if(m.official.length)o.push(m.official.map(v=>['Official broadcast',v,'yt',0]));return o}
let TP=null, A=null, twPlaying=false, twUserPause=false, twPending=null, twLoaded=null; // A = active adapter
const YA={play:()=>P.playVideo(),pause:()=>P.pauseVideo(),seek:s=>P.seekTo(s,true),time:()=>P.getCurrentTime(),dur:()=>P.getDuration(),playing:()=>P.getPlayerState()===1,vol:v=>P.setVolume(v),rate:r=>P.setPlaybackRate(r)};
const TA={play:()=>TP.play(),pause:()=>{twUserPause=true;TP.pause()},seek:s=>TP.seek(s),time:()=>TP.getCurrentTime(),dur:()=>TP.getDuration(),playing:()=>twPlaying,vol:v=>TP.setVolume(v/100),rate:()=>{$('#msg').textContent='Speed not supported on Twitch'}};
function load(){
  const [kind,vid,typ,t0]=srcList[srcIdx]; const m=cur;
  if(typ==='tw') return loadTw(vid,t0);
  NV.pause(); NV.style.display='none'; curT0=0; $('#tw').style.display='none'; $('#yt').style.display=''; $('#shield').style.display=''; if(TP){TP.pause();TP=null;twLoaded=null;$('#tw').innerHTML='';twPlaying=false} A=YA;
  $('#info').textContent=`${m.teams.join(' vs ')} · ${m.stage} · Source: ${kind}${srcList.length>1?'':''}`;
  cover('Tap ▶ to start'); const start=Math.floor(+LS['p_'+vid]||0);
  if(!P){P=new YT.Player('yt',{videoId:vid,playerVars:{controls:0,disablekb:1,fs:0,rel:0,iv_load_policy:3,modestbranding:1,playsinline:1,start},
     events:{onReady:()=>{ready=true;P.setVolume(+$('#vol').value);if(window.wantPlay&&A===YA){wantPlay=0;$('#pp').click()}},onStateChange:st}})}
  else{P.cueVideoById({videoId:vid,startSeconds:start});}
  if(P&&ready)P.getIframe().style.display='';
  clearInterval(tick); tick=setInterval(()=>{ if(!ready||!P.getCurrentTime) return;
    const t=P.getCurrentTime(), d=P.getDuration(); $('#time').textContent=fmt(t);
    if(t>2) LS['p_'+vid]=t;
    if(d>0&&t>d-3&&P.getPlayerState()===1){P.pauseVideo();P.seekTo(d-3.5,true);ended()} },500)}
const NV=document.getElementById('nv'), NATIVE=!!NV.canPlayType('application/vnd.apple.mpegurl');
let curT0=0, PROXY=new URLSearchParams(location.search).get('proxy')||'', HL=null;
fetch('data/config.json?'+Date.now()).then(r=>r.json()).then(c=>{if(!PROXY)PROXY=c.hlsProxy||''}).catch(()=>{});
const ownOK=()=>NATIVE||(PROXY&&window.Hls&&Hls.isSupported());
const NA={play:()=>NV.play().catch(e=>$('#msg').textContent='Play failed: '+e.message),pause:()=>NV.pause(),seek:s=>NV.currentTime=s,time:()=>NV.currentTime,dur:()=>NV.duration,playing:()=>!NV.paused,vol:v=>NV.volume=v/100,rate:r=>NV.playbackRate=r};
NV.onplay=()=>{if(A===NA){$('#cover').style.display='none';$('#pp').textContent='❚❚'}};
NV.onpause=()=>{if(A===NA){$('#pp').textContent='▶';cover('Paused')}};
NV.onended=()=>{if(A===NA)ended()};
async function twHls(vid){ // own player: Twitch public GQL token + usher HLS, played natively (no CORS needed for <video>)
  const q={query:'query($v:ID!){videoPlaybackAccessToken(id:$v,params:{platform:"web",playerBackend:"mediaplayer",playerType:"site"}){value signature}}',variables:{v:vid}};
  const r=await fetch('https://gql.twitch.tv/gql',{method:'POST',headers:{'Client-Id':'kimne78kx3ncx6brgo4mv6wki5h1ko'},body:JSON.stringify(q)});
  const t=(await r.json()).data.videoPlaybackAccessToken;
  return 'https://usher.ttvnw.net/vod/'+vid+'.m3u8?'+new URLSearchParams({sig:t.signature,token:t.value,allow_source:'true',player:'twitchweb'})}
function loadTw(vid,t0){
  curT0=t0;
  if(ownOK()){ if(P&&ready)P.pauseVideo(); if(TP){TP.pause()} $('#tw').style.display='none'; const yi=document.getElementById('yt'); if(yi)yi.style.display='none';
    NV.style.display=''; A=NA; $('#shield').style.display='';
    $('#info').textContent=`${cur.teams.join(' vs ')} · ${cur.stage} · Source: Caedrel (full Twitch stream)`;
    cover('Loading…'); const start=Math.floor(+LS['p_tw'+vid+'_'+cur.id]||t0); twPending=[vid,start];
    twHls(vid).then(u=>{ if(HL){HL.destroy();HL=null}
      if(!NATIVE){HL=new Hls({startPosition:twPending[1],debug:location.search.includes('hlsdebug'),xhrSetup:(x,url)=>x.open('GET',PROXY+(PROXY.includes('?')?'&':'?')+'u='+encodeURIComponent(url),true)});HL.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$('#msg').textContent='Stream error: '+d.details});HL.loadSource(u);HL.attachMedia(NV)} else NV.src=u; NV.addEventListener('loadedmetadata',()=>{NV.currentTime=start; NV.volume=+$('#vol').value/100; if(A===NA)cover('Tap ▶ to start')},{once:true})})
      .catch(e=>{$('#msg').textContent='Own player failed ('+e.message+'), using Twitch embed'; loadTwEmbed(vid,t0)});
    clearInterval(tick); tick=setInterval(()=>{ if(A!==NA)return; const t=NV.currentTime; $('#time').textContent=fmt(Math.max(0,t-curT0)); if(t>2) LS['p_tw'+vid+'_'+cur.id]=t },500); return }
  loadTwEmbed(vid,t0)}
function loadTwEmbed(vid,t0){
  NV.pause(); NV.style.display='none';
  if(P&&ready)P.pauseVideo(); A=TA; $('#tw').style.display='';
  const yi=document.getElementById('yt'); if(yi)yi.style.display='none';
  $('#info').textContent=`${cur.teams.join(' vs ')} · ${cur.stage} · Source: Caedrel (full Twitch stream)`;
  cover('Tap ▶ to start'); const start=Math.floor(+LS['p_tw'+vid+'_'+cur.id]||t0);
  twPending=[vid,start];
  const go=()=>{ if(!TP){ return }  // created on first ▶ click, while visible (Twitch blocks play if hidden at creation)

  };
  A=TA;
  clearInterval(tick); tick=setInterval(()=>{ if(!TP||A!==TA)return; const t=TP.getCurrentTime(); $('#time').textContent=fmt(Math.max(0,t-curT0));
    if(t>2) LS['p_tw'+twPending[0]+'_'+cur.id]=t },500)}
function twFrame(vid,start){ // API-free fallback (e.g. tracking protection blocked embed/v1.js)
  const h=start/3600|0,m=(start%3600)/60|0,x=start%60;
  $('#tw').innerHTML=`<iframe src="https://player.twitch.tv/?video=v${vid}&parent=${location.hostname}&time=${h}h${m}m${x}s&autoplay=true" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  TP=null; A=null; $('#msg').textContent='Basic Twitch player (page controls unavailable). If it does not start, click the video.'}
function makeTw(){try{makeTw2()}catch(e){$('#msg').textContent='Twitch player error: '+e.message+' (using basic player)'; twFrame(...twPending)}}
function makeTw2(){const [vid,start]=twPending;
  if(!(window.Twitch&&Twitch.Player)) return twFrame(vid,start);
  if(TP){TP.setVideo('v'+vid,start);TP.play();return}
  TP=new Twitch.Player('tw',{video:'v'+vid,time:start+'s',parent:[location.hostname],autoplay:true,width:'100%',height:'100%'});
      TP.addEventListener(Twitch.Player.READY,()=>{TP.setVolume(+$('#vol').value/100);TP.play()});
      TP.addEventListener(Twitch.Player.PLAY,()=>{twPlaying=true;if(TP.getMuted())TP.setMuted(false);if(A===TA){$('#cover').style.display='none';$('#pp').textContent='❚❚'}});
      TP.addEventListener(Twitch.Player.PAUSE,()=>{twPlaying=false;if(A===TA&&!twUserPause&&!TP.getMuted()){TP.setMuted(true);TP.play();$('#msg').innerHTML='Browser blocked sound — <button onclick="TP.setMuted(false);this.parentNode.textContent=\'\'">🔊 Unmute</button>';return}
      if(A===TA){$('#pp').textContent='▶';cover('Paused')}});
      TP.addEventListener(Twitch.Player.ENDED,()=>{twPlaying=false;if(A===TA)ended()});}
function ended(){cover('End of this video. Use “Next part / game” or go back.');LS['w_'+cur.id]='1'}
function cover(t){$('#cover').style.display='flex';$('#cover').textContent=t}
function st(e){ if(A!==YA)return; if(e.data===1){$('#cover').style.display='none';$('#pp').textContent='❚❚'}
  else{ $('#pp').textContent='▶'; if(e.data===2) cover('Paused'); if(e.data===0){ended()} } }
$('#pp').onclick=$('#cover').onclick=()=>{ try{play1()}catch(e){$('#msg').textContent='Error: '+e.message} };
function play1(){ if(!A&&!TP&&$('#tw iframe')&&srcList[srcIdx][2]==='tw')return; if(!A&&srcList[srcIdx]&&srcList[srcIdx][2]==='tw'){ $('#cover').style.display='none'; return twFrame(...twPending)} if(!A)return; if(A===YA&&!ready){window.wantPlay=1;return}
  if(A===TA){ if(A.playing()){A.pause();return}  // Twitch refuses to play while covered: uncover first
    twUserPause=false; $('#cover').style.display='none'; $('#shield').style.display='none'; const k=twPending.join(); if(twLoaded!==k){twLoaded=k;makeTw()} else setTimeout(()=>TP.play(),400);
    let n=0; const r=setInterval(()=>{ if(twPlaying||A!==TA||!TP){clearInterval(r);if(twPlaying)$('#msg').textContent='';return}
      if(++n===4)$('#msg').textContent='If it does not start, click the video itself once (Twitch\'s own play button).'; if(n>10){clearInterval(r);return} TP.play() },1000); return }
  if(A.playing()){A.pause();return} A.play(); let n=0; const r=setInterval(()=>{ if(++n>6||A!==YA||P.getPlayerState()===1){clearInterval(r);return} P.playVideo() },1500)};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(!A)return;const d=A.dur()||1e9;A.seek(Math.max(0,Math.min(A.time()+ +b.dataset.s,d-4)))});
$('#go').onclick=()=>{if(!A)return;const p=$('#jump').value.split(':').map(Number);let s=0;p.forEach(x=>s=s*60+x);A.seek(Math.min(s,(A.dur()||1e9)-4))};
$('#vol').oninput=e=>A&&A.vol(+e.target.value);
$('#spd').onchange=e=>A&&A.rate(+e.target.value);
const V=$('#view'), fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFS(){
  if(V.classList.contains('pfs')){V.classList.remove('pfs');document.body.style.overflow='';return}
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  const rq=V.requestFullscreen||V.webkitRequestFullscreen;
  if(rq){try{const p=rq.call(V);if(p&&p.catch)p.catch(()=>pseudo());return}catch(e){}}
  pseudo()}
function pseudo(){V.classList.add('pfs','hidectl');document.body.style.overflow='hidden'}
let hideT; function poke(){V.classList.remove('hidectl');clearTimeout(hideT);hideT=setTimeout(()=>V.classList.add('hidectl'),2500)}
V.addEventListener('mousemove',poke); document.addEventListener('fullscreenchange',()=>{if(fsEl())V.classList.add('hidectl');else V.classList.remove('hidectl')});
$('#fs').onclick=toggleFS; $('#shield').ondblclick=toggleFS;
$('#next').onclick=()=>{ if(srcIdx+1<srcList.length){srcIdx++;LS['src_'+cur.id]=srcIdx;load();$('#msg').textContent=''}
  else $('#msg').textContent='No more parts/games for this match.'};
$('#alt').onclick=()=>{const o=srcs(cur),i=o.findIndex(x=>x[0][2]+x[0][0]===srcList[0][2]+srcList[0][0]);srcList=o[(i+1)%o.length];srcIdx=0;load()};
$('#back').onclick=()=>{history.back()};
onpopstate=()=>{if(P&&ready)P.pauseVideo();if(TP)TP.pause();$('#view').style.display='none';$('#list').style.display='block';render()};
$('#showAll').onchange=render;
document.addEventListener('keydown',e=>{if($('#view').style.display!=='block'||e.target.tagName==='INPUT')return;
  if(e.key===' '){e.preventDefault();$('#pp').click()} if(e.key==='f'||e.key==='F')toggleFS(); if(e.key==='Escape'&&V.classList.contains('pfs'))toggleFS(); if(e.key==='ArrowLeft')document.querySelector('[data-s="-10"]').click(); if(e.key==='ArrowRight')document.querySelector('[data-s="10"]').click()});
window.onerror=(m)=>{const e=document.querySelector('#msg');if(e)e.textContent='Page error: '+m};
window.onYouTubeIframeAPIReady=()=>{};
fetch('data/matches.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;render();const h=(location.hash.match(/\d{6,}/g)||[]),i=D.matches.findIndex(m=>h.includes(m.id));if(i>=0){let n=0;const go=()=>(window.YT&&YT.Player)||++n>20?open(D.matches[i],i):setTimeout(go,200);go()}});
</script><script src="https://www.youtube.com/iframe_api"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script src="https://player.twitch.tv/js/embed/v1.js?v=5" onerror="window.TWJS_FAIL=1"></script></body></html>
