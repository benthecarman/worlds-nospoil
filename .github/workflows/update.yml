name: refresh-vods
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
      - run: |
          git config user.name vod-bot; git config user.email vod-bot@users.noreply.github.com
          git add data && (git diff --cached --quiet || (git commit -m "refresh vods" && git push))
